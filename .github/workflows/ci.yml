name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  lint-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: luacheck
        run: |
          sudo apt-get update -q
          # luacheck is not in the Ubuntu 24.04 repos; install via luarocks
          sudo apt-get install -y -q lua5.1 luarocks
          sudo luarocks install luacheck
          # zero-warning policy since 1.3.0 (.luacheckrc declares all globals)
          luacheck .

      - name: Metrics.md drift check
        run: python3 scripts/gen_metrics.py --check

      - name: Package dry-run (allowlist)
        run: ./scripts/package.sh

      - name: Forbidden-content gate on the zip
        run: |
          ZIP=$(ls dist/*.zip)
          echo "Pruefe $ZIP"
          if unzip -l "$ZIP" | grep -Ei 'docker|grafana|compose|Justfile|node_modules|config/|data/|\.github'; then
            echo "::error::Dev-Infrastruktur im Mod-Zip gefunden"
            exit 1
          fi
          echo "Zip ist sauber"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mod-zip
          path: dist/*.zip
          retention-days: 14

  headless-smoke:
    runs-on: ubuntu-latest
    needs: lint-and-package
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: mod-zip
          path: dist

      - name: Cache Factorio headless
        id: cache-factorio
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: factorio-headless.tar.xz
          key: factorio-headless-latest-v1

      - name: Download Factorio headless
        if: steps.cache-factorio.outputs.cache-hit != 'true'
        run: curl -sL -o factorio-headless.tar.xz "https://factorio.com/get-download/latest/headless/linux64"

      - name: Smoke test (--create with mod loaded)
        run: |
          tar -xJf factorio-headless.tar.xz
          mkdir -p factorio/mods
          cp dist/*.zip factorio/mods/
          NAME=$(python3 -c "import json;print(json.load(open('info.json'))['name'])")
          printf '{"mods":[{"name":"base","enabled":true},{"name":"%s","enabled":true}]}' "$NAME" > factorio/mods/mod-list.json
          ./factorio/bin/x64/factorio --create /tmp/smoke.zip 2>&1 | tee smoke.log
          if grep -E "^\s+[0-9.]+ Error" smoke.log; then
            echo "::error::Fehler beim Laden der Mod im Headless"
            exit 1
          fi
          grep -q "Checksum of $NAME" smoke.log && echo "Mod wurde geladen"

  benchmark-regression:
    runs-on: ubuntu-latest
    needs: lint-and-package
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: mod-zip
          path: dist

      - name: Cache Factorio headless
        id: cache-factorio
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: factorio-headless.tar.xz
          key: factorio-headless-latest-v1

      - name: Download Factorio headless
        if: steps.cache-factorio.outputs.cache-hit != 'true'
        run: curl -sL -o factorio-headless.tar.xz "https://factorio.com/get-download/latest/headless/linux64"

      - name: Build benchmark map (5 surfaces, ~700 entities)
        run: |
          tar -xJf factorio-headless.tar.xz
          mkdir -p factorio/mods
          cp -r tools/bench-builder factorio/mods/bench-builder_1.0.0
          printf '{"mods":[{"name":"base","enabled":true},{"name":"bench-builder","enabled":true}]}' > factorio/mods/mod-list.json
          ./factorio/bin/x64/factorio --create /tmp/bench.zip --map-gen-seed 1 2>&1 | grep BENCH-BUILDER

      - name: Benchmark baseline and with mod
        run: |
          set -e
          run_bench() {
            ./factorio/bin/x64/factorio --benchmark /tmp/bench.zip --benchmark-ticks 3600 2>&1 \
              | grep -E "avg:" | sed -E 's/.*avg: ([0-9.]+) ms.*max: ([0-9.]+) ms.*/\1 \2/'
          }
          printf '{"mods":[{"name":"base","enabled":true},{"name":"bench-builder","enabled":false}]}' > factorio/mods/mod-list.json
          read BASE_AVG BASE_MAX <<< "$(run_bench)"
          cp dist/*.zip factorio/mods/
          NAME=$(python3 -c "import json;print(json.load(open('info.json'))['name'])")
          printf '{"mods":[{"name":"base","enabled":true},{"name":"bench-builder","enabled":false},{"name":"%s","enabled":true}]}' "$NAME" > factorio/mods/mod-list.json
          read MOD_AVG MOD_MAX <<< "$(run_bench)"
          echo "baseline: avg=${BASE_AVG}ms max=${BASE_MAX}ms | with mod: avg=${MOD_AVG}ms max=${MOD_MAX}ms"
          python3 - "$BASE_AVG" "$MOD_AVG" "$MOD_MAX" <<'PYEOF'
          import sys
          base_avg, mod_avg, mod_max = map(float, sys.argv[1:4])
          overhead = mod_avg - base_avg
          LIMIT_OVERHEAD, LIMIT_MAX = 0.15, 12.0
          print(f"avg overhead: {overhead:.3f} ms/tick (limit {LIMIT_OVERHEAD}), max: {mod_max:.2f} ms (limit {LIMIT_MAX})")
          if overhead > LIMIT_OVERHEAD or mod_max > LIMIT_MAX:
              print("::error::Benchmark regression: collection cost exceeds threshold")
              sys.exit(1)
          print("benchmark within budget")
          PYEOF

  runtime-verification:
    runs-on: ubuntu-latest
    needs: lint-and-package
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: mod-zip
          path: dist

      - name: Cache Factorio headless
        id: cache-factorio
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: factorio-headless.tar.xz
          key: factorio-headless-latest-v1

      - name: Download Factorio headless
        if: steps.cache-factorio.outputs.cache-hit != 'true'
        run: curl -sL -o factorio-headless.tar.xz "https://factorio.com/get-download/latest/headless/linux64"

      - name: Install promtool
        run: |
          curl -sLo promtool.tgz https://github.com/prometheus/prometheus/releases/download/v3.5.0/prometheus-3.5.0.linux-amd64.tar.gz
          tar xzf promtool.tgz --strip-components=1 prometheus-3.5.0.linux-amd64/promtool

      - name: Prepare server with the packaged mod
        run: |
          tar -xJf factorio-headless.tar.xz
          mkdir -p factorio/mods
          cp dist/*.zip factorio/mods/
          NAME=$(python3 -c "import json;print(json.load(open('info.json'))['name'])")
          printf '{"mods":[{"name":"base","enabled":true},{"name":"%s","enabled":true}]}' "$NAME" > factorio/mods/mod-list.json
          ./factorio/bin/x64/factorio --create /tmp/verify.zip --map-gen-seed 1

      - name: Runtime verification (metrics are actually produced)
        run: python3 tools/verify/verify.py ./factorio/bin/x64/factorio /tmp/verify.zip --promtool ./promtool

      - name: Negative control (a broken stage must be detected)
        run: |
          # Sabotage one collector stage, rebuild, and require the harness to
          # fail. A verification job that cannot fail proves nothing.
          cp -r . /tmp/faultsrc
          cd /tmp/faultsrc
          python3 - <<'EOF'
          t = open("env.lua", encoding="utf-8").read()
          t = t.replace("local function collect_surface_state(surfaces)",
                        'local function collect_surface_state(surfaces)\n\terror("CI fault injection")', 1)
          open("env.lua", "w", encoding="utf-8").write(t)
          EOF
          ./scripts/package.sh
          cd "$GITHUB_WORKSPACE"
          rm -f factorio/mods/*.zip
          cp /tmp/faultsrc/dist/*.zip factorio/mods/
          rm -f factorio/mods/mod-settings.dat
          if python3 tools/verify/verify.py ./factorio/bin/x64/factorio /tmp/verify.zip --promtool ./promtool; then
            echo "::error::Negativkontrolle: Harness meldet Erfolg trotz defekter Stage"
            exit 1
          fi
          echo "Negativkontrolle bestanden: defekte Stage wurde erkannt"
