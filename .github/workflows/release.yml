name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Version guard (tag == info.json == changelog)
        run: ./scripts/check_release.sh "${GITHUB_REF_NAME}"

      - name: Package
        run: ./scripts/package.sh

      - name: Forbidden-content gate on the zip
        run: |
          ZIP=$(ls dist/*.zip | head -1)
          if unzip -l "$ZIP" | grep -Ei 'docker|grafana|compose|Justfile|node_modules|config/|data/|\.github'; then
            echo "::error::Dev-Infrastruktur im Mod-Zip gefunden"
            exit 1
          fi

      - name: Headless smoke test
        run: |
          curl -sL -o factorio-headless.tar.xz "https://factorio.com/get-download/latest/headless/linux64"
          tar -xJf factorio-headless.tar.xz
          mkdir -p factorio/mods
          cp "$(ls dist/*.zip | head -1)" factorio/mods/
          NAME=$(python3 -c "import json;print(json.load(open('info.json'))['name'])")
          printf '{"mods":[{"name":"base","enabled":true},{"name":"%s","enabled":true}]}' "$NAME" > factorio/mods/mod-list.json
          ./factorio/bin/x64/factorio --create /tmp/smoke.zip 2>&1 | tee smoke.log
          ! grep -E "^\s+[0-9.]+ Error" smoke.log

      - name: Upload to mod portal (both game versions)
        env:
          FACTORIO_API_KEY: ${{ secrets.FACTORIO_API_KEY }}
        run: |
          NAME=$(python3 -c "import json;print(json.load(open('info.json'))['name'])")
          # package.sh emits two zips: X.Y.Z for Factorio 2.1 and X.Y.(Z+1)
          # with identical Lua for the 2.0 stable channel. The portal assigns
          # one game version per mod version, so they must be separate
          # releases. 2.1 first, so it stays the newest release there.
          for zip in $(ls dist/*.zip | sort); do
            echo "Uploading $zip"
            ./scripts/publish.sh "$NAME" "$zip"
          done

      - name: Extract changelog for release notes
        run: |
          awk '/^Version:/{n++} n==1' changelog.txt > release-notes.txt
          head -3 release-notes.txt

      - name: GitHub release with zip asset
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: dist/*.zip
          body_path: release-notes.txt
