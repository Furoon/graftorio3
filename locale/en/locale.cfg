[mod-name]
title=graftorio3

[mod-description]
description=Export Factorio server metrics in native Prometheus text format (via node_exporter textfile collector). Fork of graftorio2 ported to Factorio 2.1, with surface filtering.

[mod-setting-name]
graftorio3-train-histogram-buckets=Train histogram buckets
graftorio3-nth-tick=Scheduler timer
graftorio3-server-save=Save prom file on server only
graftorio3-disable-train-stats=Disable train stats
graftorio3-surface-filter=Surface allowlist
graftorio3-include-platforms=Include space platforms
graftorio3-entity-count-types=Entity count types
graftorio3-collect-player-metrics=Collect per-player metrics
graftorio3-instance-label=Instance label
graftorio3-output-filename=Output filename
graftorio3-time-slicing=Spread collection over ticks
graftorio3-entity-status-types=Machine status types
graftorio3-entity-status-max-entities=Machine status scan cap

[mod-setting-description]
graftorio3-train-histogram-buckets=Train trip times (in seconds) to categorize into groups.
graftorio3-nth-tick=How often prom file is written
graftorio3-server-save=Sets if the prom file is saved on the server only
graftorio3-disable-train-stats=Disable train stats collection
graftorio3-surface-filter=Comma-separated list of surface names to collect. Leave empty to collect every surface. Restricting this is the single most effective way to cut collection cost and label cardinality on Space Age saves.
graftorio3-include-platforms=Collect metrics for space platform surfaces. Off by default: every platform is a separate surface and multiplies per-surface work.
graftorio3-entity-count-types=Comma-separated list of entity prototype types counted per surface as factorio_entity_count. Leave empty to disable. Uses count_entities_filtered, which does not build entity objects and is cheap even for large factories.
graftorio3-collect-player-metrics=Collect per-player playtime (factorio_player_online_time_ticks, factorio_player_afk_time_ticks). Off by default: player names become a label, which is unbounded cardinality on servers with high player turnover.
graftorio3-instance-label=Optional instance="..." label added to every metric series. Set a unique value per server when multiple Factorio servers feed the same Prometheus, otherwise their series collide.
graftorio3-output-filename=Filename of the metrics file inside script-output/graftorio3/. Change it when several server instances on one host share a single node_exporter textfile directory. Path separators are stripped.
graftorio3-time-slicing=Run one collection stage per tick slice instead of all stages in a single tick. A full cycle still completes every "Scheduler timer" ticks, but the per-tick cost drops to roughly one stage, which removes the periodic spike on large maps. Values within one file are then observed up to one cycle apart; turn this off if you need every series sampled in the same tick.
graftorio3-entity-status-types=Comma-separated entity types counted by operational status as factorio_entity_status (no_power, no_ingredients, full_output, working, ...). Leave empty to disable. This is the most expensive collector: reading a status needs a real entity object, unlike the plain entity counts.
graftorio3-entity-status-max-entities=Maximum entities inspected per status scan. Reaching the cap sets factorio_entity_status_truncated to 1 instead of silently reporting partial numbers.
