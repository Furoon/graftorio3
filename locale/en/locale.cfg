[mod-name]
title=graftorio3

[mod-description]
description=Export Factorio server metrics in native Prometheus text format (via node_exporter textfile collector). Fork of graftorio2 ported to Factorio 2.1, with surface filtering.

[mod-setting-name]
graftorio3-train-histogram-buckets=Train histogram buckets
graftorio3-nth-tick=Scheduler timer
graftorio3-server-save=Save prom file on server only
graftorio3-disable-train-stats=Disable train stats
graftorio3-surface-filter=Surface allowlist
graftorio3-include-platforms=Include space platforms

[mod-setting-description]
graftorio3-train-histogram-buckets=Train trip times (in seconds) to categorize into groups.
graftorio3-nth-tick=How often prom file is written
graftorio3-server-save=Sets if the prom file is saved on the server only
graftorio3-disable-train-stats=Disable train stats collection
graftorio3-surface-filter=Comma-separated list of surface names to collect. Leave empty to collect every surface. Restricting this is the single most effective way to cut collection cost and label cardinality on Space Age saves.
graftorio3-include-platforms=Collect metrics for space platform surfaces. Off by default: every platform is a separate surface and multiplies per-surface work.
