[mod-name]
title=graftorio2 - Geo's version

[mod-description]
description=Visualize metrics from your factorio game in grafana

[mod-setting-name]
graftorio2-train-histogram-buckets=Train histogram buckets
graftorio2-nth-tick=Scheduler timer
graftorio2-server-save=Save prom file on server only
graftorio2-disable-train-stats=Disable train stats
graftorio2-surface-filter=Surface allowlist
graftorio2-include-platforms=Include space platforms

[mod-setting-description]
graftorio2-train-histogram-buckets=Train trip times (in seconds) to categorize into groups.
graftorio2-nth-tick=How often prom file is written
graftorio2-server-save=Sets if the prom file is saved on the server only
graftorio2-disable-train-stats=Disable train stats collection
graftorio2-surface-filter=Comma-separated list of surface names to collect. Leave empty to collect every surface. Restricting this is the single most effective way to cut collection cost and label cardinality on Space Age saves.
graftorio2-include-platforms=Collect metrics for space platform surfaces. Off by default: every platform is a separate surface and multiplies per-surface work.
