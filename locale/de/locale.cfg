[mod-name]
title=graftorio3

[mod-description]
description=Exportiert Factorio-Servermetriken im nativen Prometheus-Textformat für den textfile-Collector des node_exporter. Factorio-2.1-Portierung von graftorio2 mit Surface-Filterung und Fixes für den Dedicated-Server-Betrieb.

[mod-setting-name]
graftorio3-train-histogram-buckets=Histogramm-Klassen für Züge
graftorio3-nth-tick=Sammelintervall
graftorio3-server-save=Prom-Datei nur auf dem Server schreiben
graftorio3-disable-train-stats=Zugstatistiken deaktivieren
graftorio3-surface-filter=Surface-Positivliste
graftorio3-include-platforms=Weltraumplattformen einbeziehen
graftorio3-entity-count-types=Typen für Entity-Zählung
graftorio3-collect-player-metrics=Spielerbezogene Metriken sammeln
graftorio3-instance-label=Instanz-Label
graftorio3-output-filename=Name der Ausgabedatei
graftorio3-time-slicing=Sammlung über Ticks verteilen
graftorio3-entity-status-types=Typen für Maschinenstatus
graftorio3-train-include-id=Zug-ID als Label
graftorio3-train-max-series=Serienbudget für Züge
graftorio3-entity-status-max-entities=Obergrenze für Statusscan

[mod-setting-description]
graftorio3-train-histogram-buckets=Fahrzeiten von Zügen (in Sekunden), die zu Gruppen zusammengefasst werden.
graftorio3-nth-tick=Wie oft die Prom-Datei geschrieben wird.
graftorio3-server-save=Legt fest, ob die Prom-Datei ausschließlich auf dem Server gespeichert wird.
graftorio3-disable-train-stats=Deaktiviert das Sammeln von Zugstatistiken. Diese tragen Zug-IDs und Stationsnamen als Label und können auf großen Karten die Kardinalität stark erhöhen.
graftorio3-surface-filter=Komma-getrennte Liste der zu sammelnden Surfaces. Leer bedeutet: alle. Die Einschränkung ist der wirksamste Hebel gegen Sammelkosten und Label-Kardinalität auf Space-Age-Spielständen.
graftorio3-include-platforms=Sammelt Metriken für Weltraumplattformen. Standardmäßig aus: Jede Plattform ist ein eigenes Surface und vervielfacht die Arbeit pro Sammellauf.
graftorio3-entity-count-types=Komma-getrennte Liste von Entity-Typen, die je Surface als factorio_entities gezählt werden. Leer deaktiviert die Zählung. Nutzt count_entities_filtered und ist dadurch auch bei großen Fabriken günstig.
graftorio3-collect-player-metrics=Sammelt Spielzeit sowie Tode und Kills je Spieler. Standardmäßig aus: Spielernamen werden zu Labels, was auf Servern mit hoher Spielerfluktuation zu unbegrenzter Kardinalität führt.
graftorio3-instance-label=Optionales Label instance="...", das an jede Metrikserie angehängt wird. Bei mehreren Factorio-Servern an einem Prometheus je Server einen eindeutigen Wert setzen, sonst kollidieren die Serien.
graftorio3-output-filename=Dateiname innerhalb von script-output/graftorio3/. Anpassen, wenn mehrere Serverinstanzen auf einem Host dasselbe textfile-Verzeichnis nutzen. Pfadtrenner werden entfernt.
graftorio3-time-slicing=Führt pro Tick-Abschnitt nur eine Sammelstufe aus statt aller Stufen in einem einzigen Tick. Ein vollständiger Durchlauf dauert weiterhin so lange wie im Sammelintervall eingestellt, die Spitzenlast pro Tick sinkt aber deutlich. Die Werte einer Datei liegen dann bis zu einen Durchlauf auseinander; bei Bedarf abschalten.
graftorio3-entity-status-types=Komma-getrennte Entity-Typen, die nach Betriebszustand gezählt werden (kein Strom, fehlende Zutaten, Ausgang voll, in Betrieb, ...). Leer deaktiviert die Erfassung. Teuerster Kollektor, da echte Entity-Objekte benötigt werden.
graftorio3-entity-status-max-entities=Maximal untersuchte Entities je Statusscan. Wird die Grenze erreicht, wird factorio_entity_status_truncated auf 1 gesetzt, statt unvollständige Zahlen als vollständig auszugeben.
graftorio3-train-include-id=Fügt Fahrtmetriken die Zug-ID als Label hinzu. Standardmäßig aus: Das erzeugt eine Serie je Zug und Stationspaar und ist die mit Abstand größte Kardinalitätsquelle. Bei ausgeschalteter Option bleibt das Label mit dem konstanten Wert "all" erhalten, damit Dashboards weiterhin funktionieren.
graftorio3-train-max-series=Maximale Anzahl unterschiedlicher Zug-Labelkombinationen. Ist das Budget erschöpft, werden neue Kombinationen verworfen und factorio_train_series_truncated auf 1 gesetzt, statt die Kardinalität unbegrenzt wachsen zu lassen.
